name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['portfolio/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage public files
        run: python3 portfolio/tools/build_pages.py --output "$RUNNER_TEMP/portfolio-pages"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/portfolio-pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
